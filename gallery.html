<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Gallery | Chobe Holdings</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@1,6..96,400..900&family=Inter:wght@200;400;600&display=swap" rel="stylesheet">
    <style>
        .serif-luxury { font-family: 'Bodoni Moda', serif; }
        .font-standard { font-family: 'Inter', sans-serif; }
        .nav-glass { background: rgba(10, 10, 10, 0.9); backdrop-filter: blur(15px); border-bottom: 1px solid rgba(255, 255, 255, 0.1); }
        .silk-card { background: #121212; border: 1px solid rgba(255, 255, 255, 0.08); overflow: hidden; border-radius: 2rem; cursor: zoom-in; position: relative; }
        .text-outline { -webkit-text-stroke: 1px #F5F5F0; color: transparent; }
        .page-title { font-size: clamp(2.5rem, 8vw, 7rem); line-height: 1; }
        html { scroll-behavior: smooth; }
        @keyframes bounce { 0%, 20%, 50%, 80%, 100% { transform: translateY(0); } 40% { transform: translateY(-10px); } 60% { transform: translateY(-5px); } }
        .animate-bounce-slow { animation: bounce 2s infinite; }
        .gallery-img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform 0.7s cubic-bezier(0.16, 1, 0.3, 1); }
        .silk-card:hover .gallery-img { transform: scale(1.08); }
        #lightbox { display: none; }
        #lightbox.active { display: flex; }
    </style>
</head>
<body class="bg-[#0A0A0A] text-[#F5F5F0] font-standard antialiased">

     <nav class="fixed w-full z-[100] nav-glass px-6 lg:px-20 py-6 flex justify-between items-center">
        <div class="text-xl lg:text-2xl font-light tracking-[0.3em] uppercase serif-luxury italic">
            CHOBE <span class="text-amber-600">HOLDINGS</span>
        </div>
        <div class="hidden lg:flex items-center space-x-12 text-[10px] uppercase tracking-[0.4em] font-medium">
            <a href="index.html" class="hover:text-amber-500 transition-colors text-stone-400">Home</a>
            <a href="experience.html" class="hover:text-amber-500 transition-colors text-stone-400">Experience</a>
            <a href="gallery.html" class="hover:text-amber-500 transition-colors text-stone-400">Gallery</a>
            <a href="lodges.html" class="ml-6 px-10 py-3 bg-white text-black font-bold rounded-full hover:bg-amber-600 transition-all">Book Now</a>
        </div>
    </nav>

    <header class="relative h-screen flex items-end justify-center pb-40 px-6 overflow-hidden">
        <div class="absolute inset-0 z-0">
            <img src="https://images.unsplash.com/photo-1547471080-7cc2caa01a7e?auto=format&fit=crop&q=80&w=2000" class="w-full h-full object-cover opacity-50">
            <div class="absolute inset-0 bg-gradient-to-t from-[#0A0A0A] via-transparent to-transparent"></div>
        </div>
        <div class="relative z-10 text-center">
            <h1 class="page-title serif-luxury italic tracking-tighter mb-4">
                Wilderness <span class="text-outline ml-4">Captured.</span>
            </h1>
            <p class="text-amber-500 text-[10px] tracking-[0.8em] uppercase opacity-60">The 2026 Archive</p>
        </div>
        <a href="#gallery-grid" class="absolute bottom-10 left-1/2 -translate-x-1/2 z-20 animate-bounce-slow group cursor-pointer">
            <svg width="30" height="30" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M7 13L12 18L17 13M12 6V17" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
        </a>
    </header>

    <section id="gallery-grid" class="relative z-20 bg-[#0A0A0A] px-6 lg:px-20 py-24 border-t border-white/5">
        <div class="max-w-7xl mx-auto">
            
            <div class="mb-16">
                <span class="text-amber-500 text-[10px] uppercase tracking-[0.5em] font-semibold">The 2026 Collection</span>
                <div class="w-12 h-[1px] bg-white/20 mt-4"></div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 lg:gap-8">
                
                <div class="silk-card lg:col-span-2 aspect-video" onclick="openLightbox('zebra-wild.jpg')">
                    <img src="zebra-wild.jpg" class="gallery-img" alt="Zebra">
                </div>
                <div class="silk-card aspect-square" onclick="openLightbox('view-wild-rhino-animal-its-natural-habitat.jpg')">
                    <img src="view-wild-rhino-animal-its-natural-habitat.jpg" class="gallery-img" alt="Rhino">
                </div>

                <div class="silk-card aspect-[4/5]" onclick="openLightbox('wild-dogs-hunting-desperate-impalas (1).jpg')">
                    <img src="wild-dogs-hunting-desperate-impalas (1).jpg" class="gallery-img" alt="Wild Dogs">
                </div>
                <div class="silk-card aspect-[4/5]" onclick="openLightbox('img-4.jpg')">
                    <img src="https://images.unsplash.com/photo-1549366021-9f761d450615?auto=format&fit=crop&q=80&w=800" class="gallery-img" alt="Leopard">
                </div>
                <div class="silk-card aspect-[4/5]" onclick="openLightbox('closeup-shot-beautiful-zebra.jpg')">
                    <img src="closeup-shot-beautiful-zebra.jpg" class="gallery-img" alt="Cheetah">
                </div>

                <div class="silk-card aspect-square" onclick="openLightbox('furry-lion-walking-addo-elephant-national-park-daytime.jpg')">
                    <img src="lion-dry-forest-landscape.jpg" class="gallery-img" alt="Lion">
                </div>
                <div class="silk-card lg:col-span-2 aspect-video" onclick="openLightbox('beautiful-shot-african-leopard-resting-rock-with-blurred-background.jpg')">
                    <img src="beautiful-shot-african-leopard-resting-rock-with-blurred-background.jpg" class="gallery-img" alt="Elephants">
                </div>

                <div class="silk-card aspect-square" onclick="openLightbox('img-8.jpg')">
                    <img src="furry-lion-walking-addo-elephant-national-park-daytime.jpg" class="gallery-img" alt="Giraffe">
                </div>
                <div class="silk-card aspect-square" onclick="openLightbox('img-9.jpg')">
                    <img src="big-black-buffalo-fields-covered-with-tall-grass-captured-african-jungles.jpg" class="gallery-img" alt="Buffalo">
                </div>
                <div class="silk-card aspect-square" onclick="openLightbox('img-10.jpg')">
                    <img src="kingfisher.png" class="gallery-img" alt="Kingfisher">
                </div>

            </div>
        </div>
    </section>

    <div id="lightbox" class="fixed inset-0 z-[200] bg-black/95 backdrop-blur-xl items-center justify-center p-4 lg:p-12" onclick="closeLightbox()">
        <img id="lightbox-img" src="" class="max-w-full max-h-full object-contain rounded-lg shadow-2xl transition-transform duration-300 scale-95">
        <div class="absolute top-8 right-8 text-[10px] tracking-[0.4em] uppercase font-bold text-white/50">Click to Close</div>
    </div>

    <footer class="bg-[#050505] py-12 px-6 lg:px-24 border-t border-white/5 text-center lg:text-left">
        <p class="text-[8px] uppercase tracking-[0.2em] text-stone-600">&copy; 2026 Chobe Holdings. All rights reserved.</p>
    </footer>

    <script>
        const lightbox = document.getElementById('lightbox');
        const lightboxImg = document.getElementById('lightbox-img');

        function openLightbox(src) {
            lightboxImg.src = src;
            lightbox.classList.add('active');
            document.body.style.overflow = 'hidden';
            setTimeout(() => { lightboxImg.style.transform = 'scale(1)'; }, 10);
        }

        function closeLightbox() {
            lightboxImg.style.transform = 'scale(0.95)';
            setTimeout(() => {
                lightbox.classList.remove('active');
                document.body.style.overflow = 'auto';
            }, 200);
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeLightbox();
        });
    </script>
</body>
</html>
